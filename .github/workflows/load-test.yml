name: load-test

on:
  pull_request:
    types: [labeled]

jobs:
  k6:
    if: github.event.label.name == 'load-test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.x'

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'

      - name: Seed tenant/user
        run: go run ./cmd/seed
        env:
          APP_ENV: development
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_DATABASE: gateway
          DB_USER: gateway
          DB_PASSWORD: gateway
          DB_SSL_MODE: disable
          DB_SCHEMA: public

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest/gateway-load-test.js
        env:
          BASE_URL: http://localhost:8080

      - name: Tear down
        if: always()
        run: docker compose down -v
