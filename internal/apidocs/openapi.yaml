openapi: 3.0.3
info:
  title: API Gateway
  description: >
    Multi-tenant API gateway: JWT authentication, RBAC authorization,
    distributed rate limiting, response caching, request validation,
    resilient proxying, and observability in front of downstream services.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local docker-compose environment

tags:
  - name: Health
    description: Liveness/readiness probes. Never authenticated, rate limited, or cached.
  - name: Auth
    description: >-
      Current-user endpoint. Login/token issuance happens directly against
      Keycloak, not the gateway — see bearerAuth below.
  - name: Onboarding
    description: Self-service tenant creation for authenticated callers with no tenant yet.
  - name: RBAC
    description: Read-only role and permission catalog.
  - name: Gateway
    description: Proxied routes forwarded to downstream services per config/routes.json.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: Reports the process is running. Does not check dependencies.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe
      description: Reports 200 only if Redis and PostgreSQL are both reachable.
      security: []
      responses:
        "200":
          description: Redis and PostgreSQL are both reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: One or both dependencies are unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /roles:
    get:
      tags: [RBAC]
      operationId: listRoles
      summary: List roles
      description: Lists every role and its permissions from the role cache.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /permissions:
    get:
      tags: [RBAC]
      operationId: listPermissions
      summary: List permissions
      description: Lists every permission from the role cache.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissions listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user
      description: >-
        Returns the authenticated caller. X-Tenant-ID is optional here
        (unlike /api/* and /onboarding): omit it to list every tenant the
        caller belongs to (e.g. for a tenant picker); supply a verified one
        to get the caller's role/permissions/profile scoped to it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalTenantID"
      responses:
        "200":
          description: >-
            Current user. Shape depends on whether X-Tenant-ID was
            supplied — see MeWithoutTenantResponse vs CurrentUserResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeWithoutTenantResponse"
                  - $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /onboarding:
    post:
      tags: [Onboarding]
      operationId: onboard
      summary: Create a tenant and become its owner
      description: >-
        For an authenticated caller with no tenant yet: creates a new
        tenant and grants the caller the `owner` role on it. No
        X-Tenant-ID header required or accepted — there's no tenant until
        this succeeds.


        Capped at `MAX_TENANTS_PER_USER` tenant memberships per user
        (default 1) — once reached, further calls return 409 rather than
        creating another tenant. Independently rate limited to
        `ONBOARDING_PER_DAY_LIMIT` attempts per user per rolling day
        (default 1), separate from and stricter than the general
        per-tenant/user API rate limit, since tenant creation is a
        privileged, expensive operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardRequest"
      responses:
        "201":
          description: Tenant created; caller is now its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            Caller already belongs to the maximum number of tenants
            (MAX_TENANTS_PER_USER).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            Onboarding attempt limit exceeded (ONBOARDING_PER_DAY_LIMIT
            per user per day) — distinct from the general per-tenant
            RateLimited response.
          headers:
            Retry-After:
              description: Seconds until the next onboarding attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{id}:
    get:
      tags: [Gateway]
      operationId: getOrder
      summary: Get order (proxied)
      description: >
        Proxied to the orders-service upstream (config/routes.json). Subject
        to JWT auth, rate limiting, response caching, and the `orders:read`
        permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequiredTenantID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order returned by the upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/orders:
    post:
      tags: [Gateway]
      operationId: createOrder
      summary: Create order (proxied)
      description: >
        Proxied to the orders-service upstream (config/routes.json). Subject
        to JWT auth, request validation, and the `orders:create` permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequiredTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created by the upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/inventory/{id}:
    get:
      tags: [Gateway]
      operationId: getInventoryItem
      summary: Get inventory item (proxied)
      description: >
        Proxied to the inventory-service upstream (config/routes.json).
        Subject to JWT auth and rate limiting; no specific permission
        required beyond a valid token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequiredTenantID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inventory item returned by the upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RS256 JWT issued by Keycloak (not the gateway) — obtain one via the
        realm's standard OAuth2 flows directly against Keycloak, then send
        it here. The gateway only validates tokens; it issues none.

  parameters:
    RequiredTenantID:
      name: X-Tenant-ID
      in: header
      required: true
      description: >-
        Which tenant to act in, re-verified against tenant_users on every
        request. Required on every /api/* route.
      schema:
        type: string
        format: uuid
    OptionalTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      description: >-
        Which tenant to act in. Optional on GET /auth/me only — omit it to
        list every tenant the caller belongs to instead.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but missing the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-tenant rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        redis:
          type: string
          example: ok
        postgres:
          type: string
          example: ok

    RoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_system_role:
          type: boolean

    PermissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string

    TenantAccessResponse:
      type: object
      description: One tenant the caller belongs to.
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string

    MeWithoutTenantResponse:
      type: object
      description: GET /auth/me's shape when no X-Tenant-ID was supplied.
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantAccessResponse"

    ProfileResponse:
      type: object
      properties:
        display_name:
          type: string
        timezone:
          type: string

    CurrentUserResponse:
      type: object
      description: >-
        GET /auth/me's shape when a verified X-Tenant-ID was supplied:
        identity, tenant-scoped role/permissions, and profile.
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        profile:
          $ref: "#/components/schemas/ProfileResponse"

    OnboardRequest:
      type: object
      required: [organization_name]
      properties:
        organization_name:
          type: string
          minLength: 2
          maxLength: 255

    OnboardResponse:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          example: owner

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        customer_email:
          type: string
          format: email
        quantity:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [customer_email, quantity]
      properties:
        customer_email:
          type: string
          format: email
        quantity:
          type: integer
          minimum: 1

    InventoryItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
