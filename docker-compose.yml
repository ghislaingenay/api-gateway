services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration job (coding-standards.md "Database Migrations"): runs
  # to completion before the gateway starts, instead of migrating on
  # production server boot.
  migrate:
    image: api-gateway-devtools:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["migrate"]
    environment: &db_env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: gateway
      DB_USER: gateway
      DB_PASSWORD: gateway
      DB_SSL_MODE: disable
      # Explicitly overridden (not just left to .env.example's default) so
      # a real .env with cloud DB_PG_CHANNELBINDING=require (e.g. Neon)
      # can't leak through and break auth against the plain local postgres
      # container, which doesn't support SCRAM-SHA-256-PLUS.
      DB_PG_CHANNELBINDING: disable
      DB_SCHEMA: public
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Reuses the repo's local dev JWT signing keys (JWT_SIGNING_*) and
      # APP_ENV; DB/Redis/PORT below are overridden to point at the
      # in-compose containers instead of .env's cloud defaults.
      - .env
    environment:
      <<: *db_env
      APP_ENV: development
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      ALLOW_AUTO_DB_MIGRATION: "false"
      # Overrides .env's localhost value with the in-compose service name
      # so the gateway container can reach jwks-service below.
      JWT_JWKS_URL: http://jwks-service:8083/.well-known/jwks.json
      # Overrides .env's localhost value so config/routes.json's
      # "$env:ORDERS_SERVICE_UPSTREAM" resolves to the orders-service
      # container instead of the gateway container itself.
      ORDERS_SERVICE_UPSTREAM: http://orders-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Mock downstream service matching config/routes.json's orders-service
  # upstream (http://orders-service:8081), for exercising the gateway's
  # full proxy flow end-to-end (FEAT-010).
  orders-service:
    image: api-gateway-devtools:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["mockorders"]
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"

  # Local JWKS publisher (no real auth/identity server exists yet): serves
  # the public half of .env's JWT_SIGNING_KID/JWT_SIGNING_PRIVATE_KEY so
  # the gateway's JWKS-backed key store has something to fetch from.
  jwks-service:
    image: api-gateway-devtools:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["mockjwks"]
    env_file:
      - .env
    ports:
      - "8083:8083"

volumes:
  postgres_data:
  redis_data:
