services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak's own database (FEAT-012): deliberately isolated from the
  # gateway's `postgres` service above, keeping Keycloak's schema lifecycle
  # (its own migrations, its own credential storage) independent of the
  # gateway's.
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Identity provider (FEAT-012): issues and signs the JWTs the gateway
  # verifies (JWT_JWKS_URL/JWT_ISSUER below), replacing the local
  # jwks-service/gateway-issued-token setup FEAT-011 used. Realm config is
  # imported once at container start from keycloak/realm-export.json —
  # realm `api-gateway`, client `client-frontend` (public, PKCE), a
  # confidential `api-gateway-backend` client for audience validation, and
  # seeded demo users matching cmd/seed's local demo tenant owners.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Full URL (not just a bare hostname) so the `iss` claim Keycloak
      # stamps into every token is deterministically
      # http://localhost:8090/realms/api-gateway — matching
      # .env.example's JWT_ISSUER — regardless of which Host header a
      # given request actually carries.
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      # Host port 8080 is already taken by the gateway service below, so
      # Keycloak is exposed on 8090 instead — this is why JWT_ISSUER in
      # .env.example is http://localhost:8090/..., not :8080.
      - "8090:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak's image has no curl/wget; this is the standard
      # /dev/tcp-based workaround for its management health endpoint.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # One-shot migration job (coding-standards.md "Database Migrations"): runs
  # to completion before the gateway starts, instead of migrating on
  # production server boot.
  migrate:
    image: api-gateway-devtools:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["migrate"]
    environment: &db_env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: gateway
      DB_USER: gateway
      DB_PASSWORD: gateway
      DB_SSL_MODE: disable
      # Explicitly overridden (not just left to .env.example's default) so
      # a real .env with cloud DB_PG_CHANNELBINDING=require (e.g. Neon)
      # can't leak through and break auth against the plain local postgres
      # container, which doesn't support SCRAM-SHA-256-PLUS.
      DB_PG_CHANNELBINDING: disable
      DB_SCHEMA: public
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Reuses the repo's local dev JWT signing keys (JWT_SIGNING_*) and
      # APP_ENV; DB/Redis/PORT below are overridden to point at the
      # in-compose containers instead of .env's cloud defaults.
      - .env
    environment:
      <<: *db_env
      APP_ENV: development
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      ALLOW_AUTO_DB_MIGRATION: "false"
      # Overrides .env's localhost value with the in-compose service name
      # so the gateway container can reach the keycloak container directly
      # to fetch signing keys. JWT_ISSUER is NOT overridden here — it's
      # only ever string-compared against the token's iss claim, never
      # dialed, and iss reflects how the frontend (always via the
      # host-mapped port, outside this compose file) reached Keycloak, so
      # .env's host-perspective value is correct whether the gateway
      # validating it runs in-container or on the host.
      JWT_JWKS_URL: http://keycloak:8080/realms/api-gateway/protocol/openid-connect/certs
      # Overrides .env's localhost value so config/routes.json's
      # "$env:ORDERS_SERVICE_UPSTREAM" resolves to the orders-service
      # container instead of the gateway container itself.
      ORDERS_SERVICE_UPSTREAM: http://orders-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # Mock downstream service matching config/routes.json's orders-service
  # upstream (http://orders-service:8081), for exercising the gateway's
  # full proxy flow end-to-end (FEAT-010).
  orders-service:
    image: api-gateway-devtools:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["mockorders"]
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  redis_data:
  keycloak_db_data:
